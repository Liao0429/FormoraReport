name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cov_fail_under: 85
          - os: ubuntu-latest
            cov_fail_under: 0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (headless, with coverage)
        run: |
          python -m pytest tests/ -q --cov=formora --cov-report=term-missing --cov-fail-under=${{ matrix.cov_fail_under }}
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
      - name: Build EXE with PyInstaller
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean FormoraReport.spec
      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FormoraReport-windows
          path: dist/FormoraReport/
