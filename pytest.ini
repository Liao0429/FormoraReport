[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --strict-markers --tb=short
markers =
    ui: UI 冒烟测试（需要 Qt，offscreen 运行）
    integration: 使用真实样例文件并生成输出的集成测试
    slow: 运行较慢的测试
    network: 涉及真实网络请求的测试（测试中默认被 mock）
    dpapi: 仅 Windows DPAPI 相关测试
filterwarnings =
    ignore::DeprecationWarning:pandas.*
    ignore::UserWarning:openpyxl.*
    ignore::DeprecationWarning:matplotlib.*
