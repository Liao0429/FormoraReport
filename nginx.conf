# =============================================================
# FormoraReport API — Nginx 反向代理配置（反向代理 + 限流 + 大文件上传）
#
# 用法：
#   容器方式：把本文件挂载到 nginx 容器 /etc/nginx/conf.d/default.conf
#   宿主机：把本文件放入 /etc/nginx/conf.d/ 后 nginx -s reload
#
# 注意：
#   - 默认 proxy_pass 指向 docker compose 网络内的服务名 formora-api。
#     如果 nginx 跑在宿主机而非容器网络，请改为 http://127.0.0.1:8000;
#   - client_max_body_size 必须 >= 应用侧 FORMORA_MAX_UPLOAD_MB（默认 20MB）。
#     修改应用上传上限时，请同步调整本值（建议留 2 倍余量）。
#   - 限流按客户端 IP（30r/m + burst 20），与 API 内置限流（FORMORA_RATE_LIMIT）叠加。
#   - 如需 HTTPS，请在此 server 块内追加 ssl_certificate / ssl_certificate_key，
#     并监听 443 ssl。
# =============================================================

# 限流区：每个客户端 IP 每分钟 30 次请求（10MB 共享内存，足够数万 IP）
limit_req_zone $binary_remote_addr zone=formora_api:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # 大文件上传：默认允许 50MB（应用侧 FORMORA_MAX_UPLOAD_MB=20 时留足余量）
    client_max_body_size 50m;
    # 上传/响应超时放宽，兼容批量生成与 LibreOffice 转换的耗时请求
    client_body_timeout 300s;

    # ---- 健康检查：不限流，供负载均衡/监控探活 ----
    location = /api/health {
        proxy_pass http://formora-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API 路由：限流 + 反向代理 + 流式下载 ----
    location /api/ {
        limit_req zone=formora_api burst=20 nodelay;

        proxy_pass http://formora-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生成/PDF 转换可能耗时，放宽读写超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 报告下载直接流式转发，避免大文件占用 nginx 内存
        proxy_buffering off;
    }

    # ---- Swagger UI / OpenAPI 文档及其他路径 ----
    location / {
        proxy_pass http://formora-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}